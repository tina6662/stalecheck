[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stalecheck"
version = "0.1.0"
description = "Catch numbers in your paper that no longer match your analysis."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "mcp>=2.0"]

[project.scripts]
stalecheck = "stalecheck.cli:main"
stalecheck-mcp = "stalecheck.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
